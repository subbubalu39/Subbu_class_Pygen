<!DOCTYPE html>
<html>
<head>
<style>
body {
    height: 1500px;
    margin: 0;
}

.box {
    width: 150px;
    padding: 15px;
    color: white;
    text-align: center;
}

/* Static */
.static {
    position: static;
    background: gray;
}

/* Relative */
.relative {
    position: relative;
    left: 50px;
    top: 10px;
    background: blue;
}

/* Parent for absolute */
.parent {
    position: relative;
    width: 300px;
    height: 150px;
    border: 2px solid black;
    margin-top: 30px;
}

/* Absolute */
.absolute {
    position: absolute;
    top: 40px;
    right: 40px;
    background: red;
}

/* Fixed */
.fixed {
    position: fixed;
    top: 10px;
    right: 10px;
    background: green;
}

/* Sticky */
.sticky {
    position: sticky;
    top: 0;
    background: orange;
}
</style>
</head>
<body>

<h2>CSS Position Examples</h2>

<div class="box static">Static</div>

<div class="box relative">Relative</div>

<div class="parent">
    Parent
    <div class="box absolute">Absolute</div>
</div>

<div class="box fixed">Fixed</div>

<div class="box sticky">Sticky</div>

<p>
Scroll down to see how Fixed and Sticky behave.
</p>

</body>
</html>
